spring.application.name=autointel

# Mensagens (inclusive de validação) em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
logging.structured.format.console=ecs

# ---------- Banco de dados (H2 em memória) ----------
spring.datasource.url=jdbc:h2:mem:autointel;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---------- JWT ----------
# Em produção defina a variável de ambiente JWT_SECRET (Base64, >= 256 bits)
app.jwt.segredo=${JWT_SECRET}
app.jwt.expiracao=${JWT_EXPIRACAO:1h}
app.jwt.emissor=autointel-api

# ---------- Carga inicial ----------
app.seed.enabled=true
app.demo-users.enabled=false
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---------- Erros no formato Problem Details (RFC 9457) ----------
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# ---------- OpenAPI / Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
